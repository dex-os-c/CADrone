<style>
/* ---------------------------------------------------------------------
   Layout: instrument-panel dashboard. 3D stage on the left, tabbed
   engineering panel on the right; stacks with a sticky stage on phones.
   Palette: cool paper greys biased to the teal accent (the pod colour),
   one warm signal colour for heat, state colours kept separate.
   Type: Barlow Condensed for titles, IBM Plex Sans for text, Plex Mono for data.
   --------------------------------------------------------------------- */
:root {
  --bg: #e9eff2; --surface: #f6f9fa; --surface2: #ffffff; --sunk: #dde6ea;
  --line: #c3d0d6; --line2: #d7e1e5;
  --ink: #10202a; --ink2: #435a67; --ink3: #6c8290;
  --accent: #0a8189; --accent-soft: #d3eceb; --on-accent: #ffffff;
  --heat: #d4531a; --heat-soft: #fbe3d6;
  --good: #1b8a4b; --warn: #b66a00; --bad: #c8302a;
  --c-hex: #0a8189; --c-quad: #c9741b; --c-grid: #c9d6dc; --c-axis: #5b727f;
  --shadow: 0 1px 2px rgba(16,32,42,.08), 0 6px 20px rgba(16,32,42,.06);
  --f-disp: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --hud: rgba(246,249,250,.86); --hud-ink: #10202a;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0a1116; --surface: #0f1920; --surface2: #142129; --sunk: #0b141a;
  --line: #243540; --line2: #1b2a33;
  --ink: #dbe7ed; --ink2: #98aeba; --ink3: #6f8795;
  --accent: #38c6cf; --accent-soft: #11363b; --on-accent: #04171a;
  --heat: #ff8a4c; --heat-soft: #3a2316;
  --good: #4cd17f; --warn: #f0b052; --bad: #ff6b61;
  --c-hex: #38c6cf; --c-quad: #f0a050; --c-grid: #1f303a; --c-axis: #8ea6b3;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --hud: rgba(12,22,28,.82); --hud-ink: #dbe7ed; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0a1116; --surface: #0f1920; --surface2: #142129; --sunk: #0b141a;
  --line: #243540; --line2: #1b2a33;
  --ink: #dbe7ed; --ink2: #98aeba; --ink3: #6f8795;
  --accent: #38c6cf; --accent-soft: #11363b; --on-accent: #04171a;
  --heat: #ff8a4c; --heat-soft: #3a2316;
  --good: #4cd17f; --warn: #f0b052; --bad: #ff6b61;
  --c-hex: #38c6cf; --c-quad: #f0a050; --c-grid: #1f303a; --c-axis: #8ea6b3;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --hud: rgba(12,22,28,.82); --hud-ink: #dbe7ed; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
input[type=range] { accent-color: var(--accent); }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; font-weight: 600; text-wrap: balance; }
h2 { font: 600 22px/1.1 var(--f-disp); letter-spacing: .02em; text-transform: uppercase; }
h3 { font: 600 12px/1.2 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); }
p { margin: 0; }

/* ---------- top bar ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; align-items: center; gap: 16px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand b { font: 700 26px/1 var(--f-disp); letter-spacing: .04em; text-transform: uppercase; }
.brand b i { color: var(--accent); font-style: normal; }
.brand span { font: 500 11px/1.2 var(--f-mono); color: var(--ink3); letter-spacing: .04em; }
.tabs { display: flex; gap: 2px; margin-left: auto; overflow-x: auto; max-width: 100%; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 8px 14px; font: 500 13px/1 var(--f-body); color: var(--ink2); border-bottom: 2px solid transparent; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.iconbtn { border: 1px solid var(--line); background: var(--surface2); border-radius: 6px; width: 34px; height: 34px; display: grid; place-items: center; }
.iconbtn:hover { border-color: var(--accent); }

/* ---------- main grid ---------- */
.app { display: grid; grid-template-columns: minmax(0, 1fr) 420px; height: calc(100vh - 53px); min-height: 520px; }
#stage { position: relative; min-width: 0; overflow: hidden; background: #aac; touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; }
#panel { min-width: 0; overflow-y: auto; background: var(--surface); border-left: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 16px; }

/* ---------- stage overlays ---------- */
.hud { position: absolute; background: var(--hud); color: var(--hud-ink); backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 8px; font: 500 12px/1.3 var(--f-mono); }
#viewbar { left: 12px; top: 12px; display: flex; gap: 4px; padding: 4px; flex-wrap: wrap; max-width: calc(100% - 24px); }
#viewbar button { border: 0; background: transparent; padding: 6px 9px; border-radius: 5px; font: 500 11px/1 var(--f-mono); letter-spacing: .04em; text-transform: uppercase; color: inherit; }
#viewbar button:hover { background: var(--accent-soft); }
#viewbar button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
#explodeBox { left: 12px; right: 12px; bottom: 12px; padding: 8px 14px; display: flex; align-items: center; gap: 14px; }
#explodeBox label { white-space: nowrap; letter-spacing: .06em; text-transform: uppercase; font-size: 11px; }
#explodeBox output { min-width: 3.2em; text-align: right; }
#explodeBox input { flex: 1; min-width: 0; }
#labelLayer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
#labelLayer svg { position: absolute; inset: 0; width: 100%; height: 100%; }
#labelLayer line { stroke: var(--accent); stroke-width: 1; opacity: .85; }
#labelLayer circle { fill: var(--accent); }
.plabel { position: absolute; transform: translateY(-50%); padding: 2px 7px; border-radius: 4px; background: var(--hud); color: var(--hud-ink); border: 1px solid var(--line); font: 500 11px/1.3 var(--f-mono); white-space: nowrap; pointer-events: auto; cursor: pointer; }
.plabel:hover, .plabel.sel { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
#statusPill { right: 12px; top: 12px; padding: 6px 10px; display: flex; gap: 10px; align-items: center; }
#statusPill i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); display: inline-block; }
#loadNote { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink2); font: 500 12px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; background: var(--bg); transition: opacity .4s; }
#loadNote.done { opacity: 0; pointer-events: none; }

/* flight HUD */
#flightHud { left: 12px; top: 12px; padding: 10px 12px; display: none; gap: 4px 16px; grid-template-columns: repeat(2, auto); }
#flightHud div { display: flex; justify-content: space-between; gap: 10px; }
#flightHud span { color: var(--ink3); }
#flightHud .full { grid-column: 1 / -1; }
#rotorBars { right: 12px; bottom: 12px; padding: 10px 12px; display: none; flex-direction: column; gap: 6px; width: min(260px, 52%); }
.rbars { display: flex; gap: 6px; align-items: flex-end; height: 74px; }
.rbar { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; height: 100%; }
.rbar .trk { flex: 1; width: 100%; background: var(--sunk); border-radius: 3px; position: relative; overflow: hidden; border: 1px solid var(--line2); }
.rbar .fil { position: absolute; left: 0; right: 0; bottom: 0; background: var(--accent); transition: background .15s; }
.rbar .cmd { position: absolute; left: -1px; right: -1px; height: 2px; background: var(--ink); opacity: .75; }
.rbar.dead .fil { background: var(--bad); }
.rbar small { font-size: 10px; color: var(--ink3); }
.rbar.dead small { color: var(--bad); font-weight: 600; }
#thrustHist { width: 100%; height: 50px; background: var(--sunk); border-radius: 4px; border: 1px solid var(--line2); }
#stick { position: absolute; left: 0; right: 0; bottom: 0; display: none; justify-content: space-between; padding: 0 20px calc(18px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }
.joy { width: 112px; height: 112px; border-radius: 50%; border: 1.5px solid var(--hud-ink); background: var(--hud); position: relative; pointer-events: auto; touch-action: none; opacity: .85; }
.joy i { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: var(--accent); }
.joy b { position: absolute; font: 500 9px var(--f-mono); color: var(--ink3); letter-spacing: .06em; }
.toast { position: absolute; left: 50%; top: 54px; transform: translateX(-50%); padding: 8px 14px; border-radius: 6px; background: var(--ink); color: var(--bg); font: 500 12px var(--f-mono); opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 5; text-align: center; max-width: 90%; }
.toast.on { opacity: .96; }

/* ---------- panel pieces ---------- */
.card { background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface2); padding: 8px 12px; border-radius: 6px; font: 500 13px/1.1 var(--f-body); }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.warn { background: var(--bad); border-color: var(--bad); color: #fff; font-weight: 600; }
.btn.sm { padding: 5px 9px; font-size: 12px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.sl { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
.sl label { font-size: 12px; color: var(--ink2); }
.sl output { font: 500 12px var(--f-mono); }
.sl input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 2px 0 0; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.kpi { background: var(--surface); border: 1px solid var(--line2); border-radius: 6px; padding: 8px 10px; min-width: 0; }
.kpi small { display: block; font: 500 10px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); }
.kpi b { font: 600 20px/1.2 var(--f-mono); font-variant-numeric: tabular-nums; }
.kpi b em { font: 400 11px var(--f-mono); color: var(--ink3); font-style: normal; margin-left: 3px; }
.kpi.good b { color: var(--good); } .kpi.warn b { color: var(--warn); } .kpi.bad b { color: var(--bad); }
.pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font: 600 11px var(--f-mono); letter-spacing: .04em; text-transform: uppercase; }
.pill.good { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.pill.bad { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
.pill.warn { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
.formula { font: 400 12px/1.7 var(--f-mono); background: var(--sunk); border: 1px solid var(--line2); border-radius: 6px; padding: 8px 10px; overflow-x: auto; white-space: pre; color: var(--ink); }
.formula .n { color: var(--accent); font-weight: 600; }
.formula .c { color: var(--ink3); }
details { border: 1px solid var(--line2); border-radius: 6px; background: var(--surface); }
details > summary { padding: 8px 10px; cursor: pointer; font: 600 12px var(--f-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--ink2); list-style: none; display: flex; justify-content: space-between; }
details > summary::after { content: '+'; color: var(--accent); }
details[open] > summary::after { content: '–'; }
details > div { padding: 0 10px 10px; display: flex; flex-direction: column; gap: 8px; }
.note { font-size: 12px; color: var(--ink2); }
.tag { font: 600 10px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; padding: 1px 6px; border-radius: 3px; background: var(--heat-soft); color: var(--heat); white-space: nowrap; }
.partlist { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.pbtn { display: flex; align-items: center; gap: 8px; text-align: left; border: 1px solid var(--line2); background: var(--surface); border-radius: 6px; padding: 6px 8px; font-size: 12px; min-width: 0; }
.pbtn span { line-height: 1.25; }
.pbtn i { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.pbtn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.pbtn .eye { margin-left: auto; opacity: .55; font: 500 10px var(--f-mono); }
table { border-collapse: collapse; width: 100%; font-size: 12px; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line2); text-align: right; font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; font-family: var(--f-body); }
th { font: 600 10px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); }
td.w { color: var(--good); font-weight: 600; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--c-axis); font: 500 10px var(--f-mono); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font: 500 11px var(--f-mono); color: var(--ink2); }
.legend i { display: inline-block; width: 16px; height: 0; border-top: 2.5px solid; vertical-align: middle; margin-right: 5px; }
.scroll-x { overflow-x: auto; }
.step { display: flex; flex-direction: column; gap: 10px; }
.step ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.dots { display: flex; gap: 5px; flex-wrap: wrap; }
.dots button { width: 22px; height: 6px; border-radius: 3px; border: 0; background: var(--line); padding: 0; }
.dots button.on { background: var(--accent); }
.dots button.past { background: var(--ink3); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12px; }
kbd { font: 500 11px var(--f-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface); }
.hide { display: none !important; }

/* ---------- small screens: stage sticks above a scrolling panel ---------- */
@media (max-width: 900px) {
  .app { display: block; height: auto; }
  #stage { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 86px); height: 44vh; min-height: 280px; z-index: 10; }
  #panel { border-left: 0; overflow: visible; }
  .top { gap: 6px 12px; }
  .brand span { display: none; }
  .tabs { margin-left: 0; order: 3; width: 100%; }
  .plabel { font-size: 9px; padding: 1px 4px; }
  #viewbar button { padding: 5px 7px; font-size: 10px; }
  #flightHud { font-size: 11px; padding: 6px 8px; }
  #stage[data-mode="flight"] #statusPill { display: none; }
  #rotorBars { top: 12px; right: 12px; bottom: auto; width: 140px; padding: 6px 8px; gap: 4px; }
  .rbars { height: 40px; } .rbar small { font-size: 8px; } #thrustHist { height: 26px; }
  #stage[data-mode="flight"] #flightHud { max-width: calc(100% - 172px); }
  .partlist { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<script>
/* ===== physics.js ===== */
/* =====================================================================
   MEDVAYU H6 · physics.js
   Pure engineering model. No DOM, no THREE, so it can be unit-tested.
   Every number marked ASSUMED is a design assumption, not measured data.
   Replace them with datasheet / test values as the 3DEXPERIENCE model matures.
   ===================================================================== */
const Phys = (() => {
  const G0 = 9.80665;          // standard gravity, m/s²
  const RGAS = 287.058;        // specific gas constant of dry air, J/(kg·K)
  const GAMMA = 1.4;           // ratio of specific heats for air
  const RHO0 = 1.225;          // ISA sea-level density, kg/m³

  /* ---------- Assumptions (all printed in the UI) ---------- */
  const A = {
    FM: 0.70,            // rotor figure of merit in hover (ASSUMED; large low-solidity props)
    CT: 0.011,           // hover thrust coefficient T/(ρ·A·(ΩR)²) (ASSUMED)
    etaMotor: 0.90,      // motor efficiency at hover (ASSUMED)
    etaEsc: 0.95,        // ESC efficiency (ASSUMED)
    pMotorMax: 2000,     // continuous electrical power limit per motor, W (ASSUMED)
    machTipMax: 0.65,    // tip Mach limit for noise and compressibility (ASSUMED)
    battSpecEnergy: 200, // pack-level specific energy, Wh/kg (ASSUMED, Li-ion pack)
    dod: 0.80,           // usable depth of discharge, keeps a 20 % reserve (ASSUMED)
    packEff: 0.97,       // pack electrical efficiency; the 3 % loss heats the pack (ASSUMED)
    capture: 0.25,       // share of motor+ESC heat delivered to the battery loop (ASSUMED)
    UAins: 6,            // insulated pack heat-loss conductance, W/K (ASSUMED)
    UAopen: 12,          // uninsulated pack heat-loss conductance, W/K (ASSUMED)
    TcellMax: 30,        // controller bypasses the loop above this cell temp, °C (ASSUMED)
    capSlope: 0.0075,    // capacity lost per °C below 25 °C (ASSUMED generic Li-ion trend)
    capFloor: 0.40       // lowest capacity factor the model returns (ASSUMED)
  };

  /* ---------- Vehicle definitions (mass figures are ASSUMED estimates) ---------- */
  const VEH = {
    hex: {
      id: 'hex', name: 'MedVayu H6', n: 6, propD: 0.914, armR: 1.00,
      thermal: true, pAux: 80,
      mFrame: 2.8, mArm: 0.28, mMotor: 0.85, mEsc: 0.15, mProp: 0.20,
      mThermal: 0.9, mAvionics: 1.3, mSkids: 1.1, mPod: 2.2, mLatch: 0.4
    },
    quad: {
      id: 'quad', name: 'Reference quad', n: 4, propD: 0.610, armR: 0.62,
      thermal: false, pAux: 50,
      mFrame: 2.2, mArm: 0.22, mMotor: 0.85, mEsc: 0.15, mProp: 0.12,

/* =====================================================================
   MEDVAYU H6 · sim.js

const SimCfg = {
  dt: 1 / 240,          // fixed physics step, s

  fdiDelay: 0.20,       // time to detect a dead motor and re-allocate, s (ASSUMED)
  tiltMax: 25,          // maximum commanded tilt, degrees (sim limit)
  vMax: 10,             // maximum horizontal speed, m/s (sim limit, not a performance claim)
  climbMax: 3.0,        // maximum climb/descent rate, m/s (sim limit)
  cdA: { hex: 0.30, quad: 0.22 },   // drag area, m² (ASSUMED)
  angDamp: 0.8,         // aerodynamic angular damping, N·m·s/rad (ASSUMED)
  skidH: 0.42,          // body origin height above ground when landed, m (matches the 3D model)

/* =====================================================================

function joystick(el, store) {
  const knob = $('i', el); let id = null;

  const mv = e => { const r = el.getBoundingClientRect(), dx = (e.clientX - r.left - r.width / 2) / 44, dy = -(e.clientY - r.top - r.height / 2) / 44, m = Math.hypot(dx, dy) || 1, k = Math.min(1, m) / m; set(dx * k, dy * k); };
  el.addEventListener('pointerdown', e => { id = e.pointerId; el.setPointerCapture(id); mv(e); e.preventDefault(); });
  el.addEventListener('pointermove', e => { if (e.pointerId === id) mv(e); });
  const end = e => { if (e.pointerId === id) { id = null; set(0, 0); } };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}

function startRace() {
  stopRace(true); startCompareRace(); buildBars(); sim.altCmd = 0.42 + 6; sim2.altCmd = 0.42 + 6; race = { t: 0, failed: false };
  flyTo([0, 6.5, 17], [0, 3.2, 0], 1.4); toast('Both aircraft take off, then motor 1 fails on each');
}
function stopRace(keep) { simCmp.on = false; race = { t: 0, failed: false }; if (!keep) { setStageMode('compare'); setView('iso'); } }
function raceWidget() {
  const el = h('', 'card'); el.innerHTML = `<h3>Motor-out race</h3><div class="row"><button class="btn pri" id="r_run">Run race</button><button class="btn warn" id="r_fail">Fail motor 1 now</button><button class="btn" id="r_reset">Reset</button></div><div class="note">Both aircraft use the same controller design: detect the failure after 0.2 s, then redistribute thrust. Only the geometry differs.</div>`;
  $('#r_run', el).addEventListener('click', startRace);
  $('#r_fail', el).addEventListener('click', () => { if (!simCmp.on) { toast('Run the race first'); return; } failBoth(); });
  $('#r_reset', el).addEventListener('click', () => stopRace(false));
  return { el, update() { } };
}
function failBoth() { sim.failMotor(0); sim2.failMotor(0); race.failed = true; }
function updateCompareHud() {
  const hud = $('#flightHud'); if (!simCmp.on) { hud.innerHTML = `<div class="full"><span>Press “Run race”</span></div>`; return; }
  const row = (nm, s) => { const t = s.telemetry(); const st = t.crashed ? 'DOWN' : t.failed.length ? 'MOTOR OUT' : t.mode.toUpperCase(); return `<div class="full"><span>${nm}</span><b style="color:${t.crashed ? 'var(--bad)' : t.failed.length ? 'var(--warn)' : 'inherit'}">${st}</b></div><div><span>AGL</span><b>${fmt(t.agl, 1)} m</b></div><div><span>TILT</span><b>${fmt(t.tilt, 0)}°</b></div>`; };
  hud.innerHTML = row('H6', sim) + row('QUAD', sim2);
}

/* ---------- notes ---------- */
function notesWidget() {
  const el = h('', 'card');
  function update() {
    el.innerHTML = `<h3>Assumptions and limits</h3><div class="note">Every number on this page comes from the model below. “Assumed” means a design assumption to be replaced by a measured, simulated or datasheet value. Nothing here is a certified performance claim.</div>
      <div class="scroll-x"><table><tr><th>Item</th><th>Value</th><th></th></tr>${assumptionRows().map(r => `<tr><td>${r[0]}</td><td style="text-align:left;font-size:12px">${r[1]}</td><td><span class="tag">${r[2]}</span></td></tr>`).join('')}</table></div>
      <h3>What to model and simulate in 3DEXPERIENCE</h3><ol style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px">${PLAN_3DX.map(p => `<li><b>${p[0]}.</b> ${p[1]}</li>`).join('')}</ol>`;
  }
  return { el, update };
}

/* ---------- guided tour ---------- */
function tourWidget() {
  const el = h('', 'card step');
  function update() {
    const i = Math.max(S.tourStep, 0), st = TOUR[i];
    el.innerHTML = `<div class="row" style="justify-content:space-between"><h3>Guided tour · ${i + 1} of ${TOUR.length}</h3></div><h2>${st.title}</h2>${st.html(ctx())}
      <div class="dots">${TOUR.map((_, k) => `<button data-k="${k}" class="${k === i ? 'on' : k < i ? 'past' : ''}" aria-label="Step ${k + 1}"></button>`).join('')}</div>
      <div class="row"><button class="btn" id="t_prev" ${i === 0 ? 'disabled' : ''}>Back</button><button class="btn pri" id="t_next" ${i === TOUR.length - 1 ? 'disabled' : ''}>Next</button><span class="note">Arrow keys also work.</span></div>`;
    $('#t_prev', el).addEventListener('click', () => tourGo(i - 1)); $('#t_next', el).addEventListener('click', () => tourGo(i + 1));
    $$('.dots button', el).forEach(b => b.addEventListener('click', () => tourGo(+b.dataset.k)));
  }
  return { el, update };
}
function tourGo(i) {
  i = clamp(i, 0, TOUR.length - 1); const first = S.tourStep < 0; S.tourStep = i; const st = TOUR[i];
  stopRace(true); setStageMode(st.stage); S.labels = !!st.labels; $('#btnLabels').setAttribute('aria-pressed', S.labels);
  exTarget = st.explode; setSelected(st.select || null);
  if (st.stage === 'compare') { flyTo([0, 3.6, 10.5], [0, 0.6, 0], 1.1); if (st.race) setTimeout(() => { if (S.tourStep === i) startRace(); }, 900); }
  else setView(st.view);
  renderPanel();
}

/* ---------- widget registry and panels ---------- */
const WG = {}; const mk = (k, f) => WG[k] || (WG[k] = f());
const PANELS = {
  design: () => [mk('parts', partsWidget), mk('info', infoWidget), mk('mass', massWidget)],
  physics: () => [mk('cond', condWidget), mk('kpi', kpiWidget), mk('endc', enduranceChart), mk('thc', thrustChart), mk('form', formulaWidget), mk('ass', assumpWidget)],
  flight: () => [mk('cond', condWidget), mk('flight', flightWidget)],
  compare: () => [mk('cond', condWidget), mk('cmp', cmpTableWidget), mk('why', whyWidget), mk('race', raceWidget), mk('endc2', enduranceChart)],
  present: () => { const st = TOUR[Math.max(S.tourStep, 0)], ex = []; if (st.tab === 'physics') ex.push(mk('endc3', enduranceChart), mk('thc2', thrustChart)); if (st.tab === 'compare') ex.push(mk('cmp2', cmpTableWidget)); if (st.tab === 'notes') ex.push(mk('notes2', notesWidget)); return [mk('tour', tourWidget), ...ex, mk('cond', condWidget)]; },
  notes: () => [mk('notes', notesWidget)]
};
let current = [];
function renderPanel() { current = PANELS[S.tab](); const p = $('#panel'); p.replaceChildren(...current.map(w => w.el)); current.forEach(w => w.update()); if (S.tab !== 'design' || true) p.scrollTop = 0; }
function updateWidgets() { current.forEach(w => w.update()); }
function showTab(tab) {
  S.tab = tab; $$('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === tab));
  const stage = tab === 'flight' ? 'flight' : tab === 'compare' ? 'compare' : 'design';
  stopRace(true); KEYS.clear();
  if (tab === 'present') { if (S.tourStep < 0) { S.tourStep = 0; } tourGo(S.tourStep); return; }
  const changed = S.stage !== stage; if (changed || tab === 'flight') setStageMode(stage);
  if (changed && stage !== 'flight') { W.controls.maxDistance = 60; setView('iso', true); }
  else if (tab === 'compare') setView('iso'); if (tab === 'design' || tab === 'physics' || tab === 'notes') { if (S.stage === 'design' && tab !== 'physics' && tab !== 'notes') { /* keep camera */ } }
  renderPanel();
}
$$('.tab').forEach(t => t.addEventListener('click', () => showTab(t.dataset.tab)));

let envRaf = 0;
function envChanged() {
  ctxDirty = true; SWEEP = null;
  const a = ctx().hex.atm; $('#statusTxt').textContent = `${fmt(S.env.h, 0)} m · ${fmt(a.Tc, 0)} °C · ρ ${fmt(a.rho, 3)}`;
  if (S.stage === 'flight') { if (!sim.armed) resetFlight(); else { sim.env.h = S.env.h; sim.env.dT = S.env.dT; } }
  cancelAnimationFrame(envRaf); envRaf = requestAnimationFrame(updateWidgets);
}

/* ---------- stage controls ---------- */
$$('#viewbar [data-view]').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
$('#btnLabels').addEventListener('click', () => { S.labels = !S.labels; $('#btnLabels').setAttribute('aria-pressed', S.labels); });
$('#btnWire').addEventListener('click', () => setWire(!S.wire));
$('#btnSpin').addEventListener('click', () => { S.spin = !S.spin; $('#btnSpin').setAttribute('aria-pressed', S.spin); });
$('#explode').addEventListener('input', e => { exTarget = null; S.explode = +e.target.value / 100; $('#explodeOut').textContent = Math.round(S.explode * 100) + '%'; });
S.hooks.push({
  onSelect() { if (S.tab === 'design' || S.tab === 'present') { if (WG.info) WG.info.update(); } },
  preStep(dt) {
    if (S.stage === 'flight') sim.setInputs(readInput());
    else if (S.stage === 'compare' && simCmp.on) { race.t += dt; if (!race.failed && race.t > 9) { failBoth(); toast('Motor 1 failed on both aircraft'); } }
  },
  onFrame(dt) {
    if (exTarget !== null) { S.explode += (exTarget - S.explode) * Math.min(1, dt * 3.5); if (Math.abs(S.explode - exTarget) < 0.002) { S.explode = exTarget; exTarget = null; } $('#explode').value = S.explode * 100; $('#explodeOut').textContent = Math.round(S.explode * 100) + '%'; }
    const f = frame % 4 === 0;
    if (S.stage === 'flight') { updateBars(sim); if (f) { updateFlightHud(); drawHistory(sim); } }
    else if (S.stage === 'compare' && f) { updateCompareHud(); if (simCmp.on) { updateBars(sim); drawHistory(sim); } }
    updateTags();
  },
  onTheme() { }
});
/* name tags above each aircraft in compare view */
const TAGS = ['MedVayu H6', 'Reference quad'].map(t => { const d = document.createElement('div'); d.className = 'plabel'; d.textContent = t; d.style.display = 'none'; $('#labelLayer').appendChild(d); return d; });
const _tp = new THREE.Vector3();
function updateTags() {
  const on = S.stage === 'compare' && !simCmp.on; TAGS.forEach((t, i) => { t.style.display = on ? 'block' : 'none'; if (!on) return; _tp.set((i ? 1 : -1) * CMP_X, 0.95, 0).project(W.camera); t.style.left = ((_tp.x * 0.5 + 0.5) * W.stage.clientWidth) + 'px'; t.style.top = ((-_tp.y * 0.5 + 0.5) * W.stage.clientHeight - 38) + 'px'; t.style.transform = 'translate(-50%,-50%)'; });
}

/* ---------- boot ---------- */
buildBars(); envChanged(); showTab('design');
if (location.hash === '#present') showTab('present');

</script>
