<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* ---------------------------------------------------------------------
   Layout: instrument-panel dashboard. 3D stage on the left, tabbed
   engineering panel on the right; stacks with a sticky stage on phones.
   Palette: cool paper greys biased to the teal accent (the pod colour),
   one warm signal colour for heat, state colours kept separate.
   Type: Barlow Condensed for titles, IBM Plex Sans for text, Plex Mono for data.
   --------------------------------------------------------------------- */
:root {
  --bg: #e9eff2; --surface: #f6f9fa; --surface2: #ffffff; --sunk: #dde6ea;
  --line: #c3d0d6; --line2: #d7e1e5;
  --ink: #10202a; --ink2: #435a67; --ink3: #6c8290;
  --accent: #0a8189; --accent-soft: #d3eceb; --on-accent: #ffffff;
  --heat: #d4531a; --heat-soft: #fbe3d6;
  --good: #1b8a4b; --warn: #b66a00; --bad: #c8302a;
  --c-hex: #0a8189; --c-quad: #c9741b; --c-grid: #c9d6dc; --c-axis: #5b727f;
  --shadow: 0 1px 2px rgba(16,32,42,.08), 0 6px 20px rgba(16,32,42,.06);
  --f-disp: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --hud: rgba(246,249,250,.86); --hud-ink: #10202a;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0a1116; --surface: #0f1920; --surface2: #142129; --sunk: #0b141a;
  --line: #243540; --line2: #1b2a33;
  --ink: #dbe7ed; --ink2: #98aeba; --ink3: #6f8795;
  --accent: #38c6cf; --accent-soft: #11363b; --on-accent: #04171a;
  --heat: #ff8a4c; --heat-soft: #3a2316;
  --good: #4cd17f; --warn: #f0b052; --bad: #ff6b61;
  --c-hex: #38c6cf; --c-quad: #f0a050; --c-grid: #1f303a; --c-axis: #8ea6b3;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --hud: rgba(12,22,28,.82); --hud-ink: #dbe7ed; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0a1116; --surface: #0f1920; --surface2: #142129; --sunk: #0b141a;
  --line: #243540; --line2: #1b2a33;
  --ink: #dbe7ed; --ink2: #98aeba; --ink3: #6f8795;
  --accent: #38c6cf; --accent-soft: #11363b; --on-accent: #04171a;
  --heat: #ff8a4c; --heat-soft: #3a2316;
  --good: #4cd17f; --warn: #f0b052; --bad: #ff6b61;
  --c-hex: #38c6cf; --c-quad: #f0a050; --c-grid: #1f303a; --c-axis: #8ea6b3;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --hud: rgba(12,22,28,.82); --hud-ink: #dbe7ed; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
input[type=range] { accent-color: var(--accent); }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; font-weight: 600; text-wrap: balance; }
h2 { font: 600 22px/1.1 var(--f-disp); letter-spacing: .02em; text-transform: uppercase; }
h3 { font: 600 12px/1.2 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); }
p { margin: 0; }

/* ---------- top bar ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; align-items: center; gap: 16px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand b { font: 700 26px/1 var(--f-disp); letter-spacing: .04em; text-transform: uppercase; }
.brand b i { color: var(--accent); font-style: normal; }
.brand span { font: 500 11px/1.2 var(--f-mono); color: var(--ink3); letter-spacing: .04em; }
.tabs { display: flex; gap: 2px; margin-left: auto; overflow-x: auto; max-width: 100%; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 8px 14px; font: 500 13px/1 var(--f-body); color: var(--ink2); border-bottom: 2px solid transparent; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.iconbtn { border: 1px solid var(--line); background: var(--surface2); border-radius: 6px; width: 34px; height: 34px; display: grid; place-items: center; }
.iconbtn:hover { border-color: var(--accent); }

/* ---------- main grid ---------- */
.app { display: grid; grid-template-columns: minmax(0, 1fr) 420px; height: calc(100vh - 53px); min-height: 520px; }
#stage { position: relative; min-width: 0; overflow: hidden; background: #aac; touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; }
#panel { min-width: 0; overflow-y: auto; background: var(--surface); border-left: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 16px; }

/* ---------- stage overlays ---------- */
.hud { position: absolute; background: var(--hud); color: var(--hud-ink); backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 8px; font: 500 12px/1.3 var(--f-mono); }
#viewbar { left: 12px; top: 12px; display: flex; gap: 4px; padding: 4px; flex-wrap: wrap; max-width: calc(100% - 24px); }
#viewbar button { border: 0; background: transparent; padding: 6px 9px; border-radius: 5px; font: 500 11px/1 var(--f-mono); letter-spacing: .04em; text-transform: uppercase; color: inherit; }
#viewbar button:hover { background: var(--accent-soft); }
#viewbar button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
#explodeBox { left: 12px; right: 12px; bottom: 12px; padding: 8px 14px; display: flex; align-items: center; gap: 14px; }
#explodeBox label { white-space: nowrap; letter-spacing: .06em; text-transform: uppercase; font-size: 11px; }
#explodeBox output { min-width: 3.2em; text-align: right; }
#explodeBox input { flex: 1; min-width: 0; }
#labelLayer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
#labelLayer svg { position: absolute; inset: 0; width: 100%; height: 100%; }
#labelLayer line { stroke: var(--accent); stroke-width: 1; opacity: .85; }
#labelLayer circle { fill: var(--accent); }
.plabel { position: absolute; transform: translateY(-50%); padding: 2px 7px; border-radius: 4px; background: var(--hud); color: var(--hud-ink); border: 1px solid var(--line); font: 500 11px/1.3 var(--f-mono); white-space: nowrap; pointer-events: auto; cursor: pointer; }
.plabel:hover, .plabel.sel { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
#statusPill { right: 12px; top: 12px; padding: 6px 10px; display: flex; gap: 10px; align-items: center; }
#statusPill i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); display: inline-block; }
#loadNote { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink2); font: 500 12px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; background: var(--bg); transition: opacity .4s; }
#loadNote.done { opacity: 0; pointer-events: none; }

/* flight HUD */
#flightHud { left: 12px; top: 12px; padding: 10px 12px; display: none; gap: 4px 16px; grid-template-columns: repeat(2, auto); }
#flightHud div { display: flex; justify-content: space-between; gap: 10px; }
#flightHud span { color: var(--ink3); }
#flightHud .full { grid-column: 1 / -1; }
#rotorBars { right: 12px; bottom: 12px; padding: 10px 12px; display: none; flex-direction: column; gap: 6px; width: min(260px, 52%); }
.rbars { display: flex; gap: 6px; align-items: flex-end; height: 74px; }
.rbar { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; height: 100%; }
.rbar .trk { flex: 1; width: 100%; background: var(--sunk); border-radius: 3px; position: relative; overflow: hidden; border: 1px solid var(--line2); }
.rbar .fil { position: absolute; left: 0; right: 0; bottom: 0; background: var(--accent); transition: background .15s; }
.rbar .cmd { position: absolute; left: -1px; right: -1px; height: 2px; background: var(--ink); opacity: .75; }
.rbar.dead .fil { background: var(--bad); }
.rbar small { font-size: 10px; color: var(--ink3); }
.rbar.dead small { color: var(--bad); font-weight: 600; }
#thrustHist { width: 100%; height: 50px; background: var(--sunk); border-radius: 4px; border: 1px solid var(--line2); }
#stick { position: absolute; left: 0; right: 0; bottom: 0; display: none; justify-content: space-between; padding: 0 20px calc(18px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }
.joy { width: 112px; height: 112px; border-radius: 50%; border: 1.5px solid var(--hud-ink); background: var(--hud); position: relative; pointer-events: auto; touch-action: none; opacity: .85; }
.joy i { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: var(--accent); }
.joy b { position: absolute; font: 500 9px var(--f-mono); color: var(--ink3); letter-spacing: .06em; }
.toast { position: absolute; left: 50%; top: 54px; transform: translateX(-50%); padding: 8px 14px; border-radius: 6px; background: var(--ink); color: var(--bg); font: 500 12px var(--f-mono); opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 5; text-align: center; max-width: 90%; }
.toast.on { opacity: .96; }

/* ---------- panel pieces ---------- */
.card { background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface2); padding: 8px 12px; border-radius: 6px; font: 500 13px/1.1 var(--f-body); }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.warn { background: var(--bad); border-color: var(--bad); color: #fff; font-weight: 600; }
.btn.sm { padding: 5px 9px; font-size: 12px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.sl { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
.sl label { font-size: 12px; color: var(--ink2); }
.sl output { font: 500 12px var(--f-mono); }
.sl input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 2px 0 0; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.kpi { background: var(--surface); border: 1px solid var(--line2); border-radius: 6px; padding: 8px 10px; min-width: 0; }
.kpi small { display: block; font: 500 10px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); }
.kpi b { font: 600 20px/1.2 var(--f-mono); font-variant-numeric: tabular-nums; }
.kpi b em { font: 400 11px var(--f-mono); color: var(--ink3); font-style: normal; margin-left: 3px; }
.kpi.good b { color: var(--good); } .kpi.warn b { color: var(--warn); } .kpi.bad b { color: var(--bad); }
.pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font: 600 11px var(--f-mono); letter-spacing: .04em; text-transform: uppercase; }
.pill.good { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.pill.bad { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
.pill.warn { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
.formula { font: 400 12px/1.7 var(--f-mono); background: var(--sunk); border: 1px solid var(--line2); border-radius: 6px; padding: 8px 10px; overflow-x: auto; white-space: pre; color: var(--ink); }
.formula .n { color: var(--accent); font-weight: 600; }
.formula .c { color: var(--ink3); }
details { border: 1px solid var(--line2); border-radius: 6px; background: var(--surface); }
details > summary { padding: 8px 10px; cursor: pointer; font: 600 12px var(--f-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--ink2); list-style: none; display: flex; justify-content: space-between; }
details > summary::after { content: '+'; color: var(--accent); }
details[open] > summary::after { content: '–'; }
details > div { padding: 0 10px 10px; display: flex; flex-direction: column; gap: 8px; }
.note { font-size: 12px; color: var(--ink2); }
.tag { font: 600 10px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; padding: 1px 6px; border-radius: 3px; background: var(--heat-soft); color: var(--heat); white-space: nowrap; }
.partlist { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.pbtn { display: flex; align-items: center; gap: 8px; text-align: left; border: 1px solid var(--line2); background: var(--surface); border-radius: 6px; padding: 6px 8px; font-size: 12px; min-width: 0; }
.pbtn span { line-height: 1.25; }
.pbtn i { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.pbtn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.pbtn .eye { margin-left: auto; opacity: .55; font: 500 10px var(--f-mono); }
table { border-collapse: collapse; width: 100%; font-size: 12px; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line2); text-align: right; font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; font-family: var(--f-body); }
th { font: 600 10px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); }
td.w { color: var(--good); font-weight: 600; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--c-axis); font: 500 10px var(--f-mono); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font: 500 11px var(--f-mono); color: var(--ink2); }
.legend i { display: inline-block; width: 16px; height: 0; border-top: 2.5px solid; vertical-align: middle; margin-right: 5px; }
.scroll-x { overflow-x: auto; }
.step { display: flex; flex-direction: column; gap: 10px; }
.step ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.dots { display: flex; gap: 5px; flex-wrap: wrap; }
.dots button { width: 22px; height: 6px; border-radius: 3px; border: 0; background: var(--line); padding: 0; }
.dots button.on { background: var(--accent); }
.dots button.past { background: var(--ink3); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12px; }
kbd { font: 500 11px var(--f-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface); }
.hide { display: none !important; }

/* ---------- small screens: stage sticks above a scrolling panel ---------- */
@media (max-width: 900px) {
  .app { display: block; height: auto; }
  #stage { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 86px); height: 44vh; min-height: 280px; z-index: 10; }
  #panel { border-left: 0; overflow: visible; }
  .top { gap: 6px 12px; }
  .brand span { display: none; }
  .tabs { margin-left: 0; order: 3; width: 100%; }
  .plabel { font-size: 9px; padding: 1px 4px; }
  #viewbar button { padding: 5px 7px; font-size: 10px; }
  #flightHud { font-size: 11px; padding: 6px 8px; }
  #stage[data-mode="flight"] #statusPill { display: none; }
  #rotorBars { top: 12px; right: 12px; bottom: auto; width: 140px; padding: 6px 8px; gap: 4px; }
  .rbars { height: 40px; } .rbar small { font-size: 8px; } #thrustHist { height: 26px; }
  #stage[data-mode="flight"] #flightHud { max-width: calc(100% - 172px); }
  .partlist { grid-template-columns: 1fr 1fr; }
}

/* ---------- full-screen flight: the stage covers the screen and every control lives inside it ---------- */
#fsUi { display: none; }
body.fs { overflow: hidden; }
body.fs .top, body.fs #panel { display: none !important; }
body.fs .app { display: block; height: 100vh; height: 100dvh; min-height: 0; }
body.fs #stage { position: fixed !important; inset: 0; top: 0 !important; height: auto !important; min-height: 0 !important; z-index: 100; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
body.fs #fsUi { display: block; }
body.fs #statusPill { display: none; }
body.fs .toast { top: auto; bottom: calc(232px + env(safe-area-inset-bottom, 0px)); }
body.fs #flightHud { top: calc(10px + env(safe-area-inset-top, 0px)); left: calc(10px + env(safe-area-inset-left, 0px)); max-width: calc(100% - 190px); }
body.fs #rotorBars { top: calc(54px + env(safe-area-inset-top, 0px)); right: calc(10px + env(safe-area-inset-right, 0px)); bottom: auto; width: 150px; }
body.fs #stick { padding: 0 calc(18px + env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) calc(18px + env(safe-area-inset-left, 0px)); }
.fsbtn { padding: 9px 14px; font: 600 13px/1 var(--f-body); color: var(--hud-ink); cursor: pointer; }
.fsbtn.bad { background: var(--bad); color: #fff; border-color: var(--bad); }
#fsExit { right: calc(10px + env(safe-area-inset-right, 0px)); top: calc(10px + env(safe-area-inset-top, 0px)); }
#fsBar { left: 50%; transform: translateX(-50%); bottom: calc(150px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 4px; padding: 4px; max-width: calc(100% - 20px); }
#fsBar button { border: 0; background: transparent; color: var(--hud-ink); padding: 10px 12px; border-radius: 6px; font: 600 12px/1 var(--f-body); }
#fsBar button.pri { background: var(--accent); color: var(--on-accent); }
#fsBar button:active { background: var(--accent-soft); }
#fsFail .fsbtn { position: static; }
#fsFail { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
@media (orientation: landscape) and (max-height: 520px) {
  #fsBar { bottom: auto; top: calc(10px + env(safe-area-inset-top, 0px)); }
  body.fs #flightHud { max-width: 210px; }
  body.fs #rotorBars { top: calc(56px + env(safe-area-inset-top, 0px)); }
  .joy { width: 100px; height: 100px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
